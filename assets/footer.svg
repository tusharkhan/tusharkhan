<text x="640" y="88" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#8B949E" opacity="0.75" letter-spacing="0.3">Simplicity is the soul of efficiency.</text>
